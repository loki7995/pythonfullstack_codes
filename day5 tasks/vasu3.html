<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>TechStore - HP Laptop</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background-color: #f1f5fb;
        color: #111;
      }

      /* Header */
      header {
        height: 117px;
        background-color: #111827;
        color: white;

        display: flex;
        align-items: center;
        justify-content: space-between;

        padding: 0 40px;
      }

      header h1 {
        font-size: 26px;
      }

      nav a {
        color: white;
        text-decoration: none;
        margin-left: 35px;
        font-size: 18px;
      }

      /* Product Section */
      .product {
        min-height: 543px;

        display: flex;
        align-items: center;
        justify-content: center;

        gap: 65px;
      }

      /* Product Image */
      .product-image {
        width: 380px;
        height: 325px;

        background-color: #dbeafe;

        display: flex;
        align-items: center;
        justify-content: center;
      }

      .product-image img {
        width: 70px;
        height: 70px;
        object-fit: contain;
      }

      /* Product Details */
      .product-details {
        width: 450px;
      }

      .product-details h2 {
        color: #2563eb;
        font-size: 34px;
        margin-bottom: 25px;
      }

      .product-details p {
        font-size: 17px;
        margin-bottom: 35px;
      }

      .price {
        color: green;
        font-size: 30px;
        margin-bottom: 35px;
      }

      .buy-btn {
        background-color: #2563eb;
        color: white;

        border: none;
        border-radius: 5px;

        padding: 14px 32px;
        font-size: 15px;

        cursor: pointer;
      }

      .buy-btn:hover {
        background-color: #1d4ed8;
      }

      /* Footer */
      footer {
        height: 55px;
        background-color: #111827;
        color: white;

        display: flex;
        align-items: center;
        justify-content: center;

        font-size: 16px;
      }
    </style>
  </head>

  <body>
    <!-- Header -->
    <header>
      <h1>TechStore</h1>

      <nav>
        <a href="#">Home</a>
        <a href="#">Products</a>
        <a href="#">Contact</a>
      </nav>
    </header>

    <!-- Product Section -->
    <section class="product">
      <div class="product-image">
        <img
          src="https://cdn-icons-png.flaticon.com/512/3474/3474360.png"
          alt="Laptop"
        />
      </div>

      <div class="product-details">
        <h2>HP Laptop</h2>

        <p>Powerful laptop for programming and everyday work.</p>

        <div class="price">₹50,000</div>

        <button class="buy-btn">Buy Now</button>
      </div>
    </section>

    <!-- Footer -->
    <footer>© 2026 TechStore</footer>
  </body>
</html>

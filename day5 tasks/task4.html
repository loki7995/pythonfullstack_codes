<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TechStore - Robot</title>
    <style>
      body {
        margin: 0;
        background-color: #f1f5fb;
        color: #111;
        font-family: Arial, sans-serif;
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 28px 44px;
        background-color: #111827;
        color: white;
      }

      .header h1 {
        margin: 0;
        font-size: 26px;
      }

      .navigation a {
        margin-left: 34px;
        color: white;
        text-decoration: none;
      }

      .product {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 68px;
        padding: 110px 20px;
      }

      .product-image {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 396px;
        height: 340px;
        background-color: #dbeafe;
        font-size: 52px;
      }

      .product-details h2 {
        margin: 0 0 26px;
        color: #2864d9;
        font-size: 36px;
      }

      .product-details p {
        margin: 0 0 38px;
        font-size: 18px;
      }

      .price {
        margin-bottom: 34px;
        color: green;
        font-size: 32px;
      }

      .buy-button {
        padding: 16px 34px;
        border: none;
        border-radius: 6px;
        background-color: #2864e8;
        color: white;
        font-size: 16px;
        cursor: pointer;
      }

      .footer {
        padding: 18px;
        background-color: #111827;
        color: white;
        text-align: center;
      }

      @media (max-width: 700px) {
        .header {
          flex-direction: column;
          gap: 18px;
          padding: 22px;
        }

        .navigation a {
          margin: 0 10px;
        }

        .product {
          flex-direction: column;
          gap: 32px;
          padding: 50px 20px;
        }

        .product-image {
          width: 90%;
        }

        .product-details {
          text-align: center;
        }
      }
    </style>
  </head>
  <body>
    <header class="header">
      <h1>TechStore</h1>
      <nav class="navigation">
        <a href="#home">Home</a>
        <a href="#products">Products</a>
        <a href="#contact">Contact</a>
      </nav>
    </header>

    <main class="product" id="products">
      <div class="product-image">🤖</div>

      <section class="product-details" id="home">
        <h2>Robot</h2>
        <p>A smart robot for learning and everyday tasks.</p>
        <div class="price">₹50,000</div>
        <button class="buy-button" type="button">Buy Now</button>
      </section>
    </main>

    <footer class="footer" id="contact">&copy; 2026 TechStore</footer>
  </body>
</html>

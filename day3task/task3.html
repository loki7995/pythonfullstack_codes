<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Beautiful Nature</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #27302f;
        color: #fff;
        font-family: Arial, Helvetica, sans-serif;
      }

      .nature-card {
        position: relative;
        width: 100%;
        min-height: 100vh;
        min-height: 100svh;
        overflow: hidden;
        background: #27302f;
      }

      .nature-image {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .nature-copy {
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        display: block;
        min-height: 42vh;
        min-height: 42svh;
        padding: 34px 32px;
        background: rgba(0, 0, 0, 0.78);
      }

      .nature-copy h1 {
        display: block;
        margin: 15px 0 27px;
        font-size: 29px;
        line-height: 1.2;
      }

      .nature-copy p {
        display: block;
        margin: 0;
        font-size: 20px;
        line-height: 1.4;
      }

      @media (max-width: 480px) {
        .nature-copy {
          padding: 24px 20px;
        }

        .nature-copy h1 {
          margin: 4px 0 12px;
          font-size: 23px;
        }

        .nature-copy p {
          font-size: 16px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <article class="nature-card">
        <img
          class="nature-image"
          src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=1252&h=832&q=85"
          alt="Sun setting over layered mountain ridges"
        />
        <div class="nature-copy">
          <h1>Beautiful Nature</h1>
          <p>Explore the beauty of nature.</p>
        </div>
      </article>
    </main>
  </body>
</html>

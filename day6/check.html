<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <form>
      a = <input type="text" id="a" />

      <input type="button" value="submit" onclick="large()" />
      output:
      <p id="p"></p>
    </form>
    <script>
      function large() {
        a = parseInt(document.getElementById("a"));
        if (a % 5 == 0 && a % 11 == 0) {
          document.getElementById("p").innerHTML = "yes divisible";
        } else {
          document.getElementById("p").innerHTML = "not divisible";
        }
      }
    </script>
  </body>
</html>

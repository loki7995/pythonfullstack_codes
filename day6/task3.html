  <form>
    <input type="text" id="marks" />
    <input type="button" value="hit me" onclick="grade()" />
  </form>
  <body>
    <script>
      function grade() {
        marks = document.getElementById("marks").value = "yes";
        if (marks > 101 && marks < 0) {
          document.write("<h1>not valid</h1>");
        } else if (marks >= 90 && marks <= 100) {
          document.write("<h1>A grade</h1>");
        } else if (marks >= 70 && marks <= 80) {
          document.write("<h1>A grade</h1>");
        } else if (marks >= 50 && marks <= 60) {
          document.write("<h1>A grade</h1>");
        } else {
          document.write("<h1>A grade</h1>");
        }
      }
    </script>
